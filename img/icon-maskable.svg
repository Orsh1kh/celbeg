<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e63946"/>
      <stop offset="1" stop-color="#c0392b"/>
    </linearGradient>
  </defs>
  <!-- Maskable / апп-ын икон: дүүрэн дэвсгэр; лого (C + цэг) 70% болгож
       Android adaptive-ийн аюулгүй бүс (төвөөс 40%)-д багтаасан -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(0.7) translate(-256 -256)">
    <text x="50%" y="55%" text-anchor="middle" dominant-baseline="middle"
          font-family="Arial Black, Impact, sans-serif" font-weight="900"
          font-size="232" fill="#fff">C</text>
    <circle cx="384" cy="140" r="38" fill="#fff"/>
    <circle cx="384" cy="140" r="16" fill="#1a1a1a"/>
  </g>
</svg>
